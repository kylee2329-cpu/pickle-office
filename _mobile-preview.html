<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><title>mobile preview</title>

  body { margin:0; background:#222; font-family:sans-serif; display:flex; gap:16px; padding:16px; }
  .frame { background:#fff; box-shadow:0 0 0 1px #444; }
  iframe { display:block; border:0; }
  .label { color:#fff; font-size:11px; padding:2px 4px; }
</style></head>
<body>
  <div><div class="label">Android 390 × 844</div><div class="frame"><iframe src="index.html" width="390" height="844"></iframe></div></div>
  <div><div class="label">360 × 780</div><div class="frame"><iframe src="index.html" width="360" height="780"></iframe></div></div>
</body></html>
