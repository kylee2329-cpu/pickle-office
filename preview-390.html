<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390px 미리보기 (임시)</title>
<style>
  body { margin: 0; background: #222; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 24px; padding: 16px; align-items: flex-start; }
  .frame { background: #fff; }
  .cap { color: #ddd; font-size: 12px; margin-bottom: 6px; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<div class="row">
  <div>
    <div class="cap">390 × 844 (#chat)</div>
    <iframe id="f1" src="https://kylee2329-cpu.github.io/pickle-office/?v=#chat" width="390" height="844"></iframe>
  </div>
  <div>
    <div class="cap">390 × 667 (#chat)</div>
    <iframe id="f2" src="https://kylee2329-cpu.github.io/pickle-office/?v=#chat" width="390" height="667"></iframe>
  </div>
</div>
<script>
  // 캐시된 예전 CSS를 피하기 위해 iframe 주소에 현재 시각을 붙입니다.
  const t = Date.now();
  document.querySelectorAll('iframe').forEach((f) => { f.src = f.src.replace('?v=', '?v=' + t + '&'); });
</script>
</body>
</html>
